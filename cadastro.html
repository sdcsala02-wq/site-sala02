  <style>
    :root {
      --azul: #071f3d;
      --azul-escuro: #020914;
      --dourado: #d7a85e;
      --fundo: #f4efe7;
      --texto: #334155;
      --borda: #cbd5e1;
      --erro: #b42318;
      --sucesso: #067647;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--azul),
        var(--azul-escuro)
      );
      color: var(--azul);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 38px;
      border-radius: 28px;
      background: var(--fundo);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
    }

    .marca {
      margin: 0 0 8px;
      color: var(--dourado);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .introducao {
      margin: 0 0 28px;
      color: var(--texto);
      line-height: 1.55;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      border: 1px solid var(--borda);
      border-radius: 13px;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--dourado);
      box-shadow: 0 0 0 3px rgba(215, 168, 94, 0.22);
    }

    .secao-empresa {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 20px;
      border: 1px solid #d9c9ad;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.45);
    }

    .secao-empresa h2 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 18px;
    }

    [hidden] {
      display: none !important;
    }

    .ajuda {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
    }

    .aceites {
      display: grid;
      gap: 12px;
      margin: 22px 0;
    }

    .aceite {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 10px;
      align-items: start;
      color: var(--texto);
      font-size: 14px;
      line-height: 1.45;
    }

    .aceite input {
      width: 18px;
      min-height: 18px;
      margin-top: 2px;
    }

    .aceite a {
      color: var(--azul);
      font-weight: 800;
    }

    button {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--azul);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .mensagem {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
    }

    .mensagem.erro {
      color: var(--erro);
    }

    .mensagem.sucesso {
      color: var(--sucesso);
    }

    .voltar {
      display: block;
      margin-top: 20px;
      color: var(--azul);
      text-align: center;
      font-weight: 900;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .card {
        padding: 26px 20px;
      }

      .grade,
      .secao-empresa {
        grid-template-columns: 1fr;
      }

      .campo-completo,
      .secao-empresa,
      .secao-empresa h2 {
        grid-column: 1;
      }
    }
  </style>

<body>
  <main class="card">
    <p class="marca">SDC SALA 02</p>

    <h1>Crie seu acesso</h1>

    <p class="introducao">
      Cadastre o responsável para acompanhar processos,
      documentos e movimentações pelo Portal do Cliente.
    </p>

    <form id="formCadastro" novalidate>
      <div class="grade">
        <div class="campo campo-completo">
          <label for="tipoPessoa">Tipo de cadastro</label>

          <select id="tipoPessoa" required>
            <option value="PF">Pessoa Física</option>
            <option value="PJ">Pessoa Jurídica</option>
          </select>
        </div>

        <div class="campo campo-completo">
          <label for="nome">Nome completo do responsável</label>

          <input
            type="text"
            id="nome"
            minlength="3"
            maxlength="150"
            autocomplete="name"
            required
          >
        </div>

        <div class="campo">
          <label for="cpf">CPF do responsável</label>

          <input
            type="text"
            id="cpf"
            inputmode="numeric"
            maxlength="14"
            autocomplete="off"
            required
          >
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>

          <input
            type="tel"
            id="telefone"
            inputmode="numeric"
            maxlength="15"
            autocomplete="tel"
          >
        </div>

        <div class="campo campo-completo">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            maxlength="180"
            autocomplete="email"
            required
          >
        </div>

        <section
          id="dadosEmpresa"
          class="secao-empresa"
          hidden
        >
          <h2>Dados da empresa</h2>

          <div class="campo campo-completo">
            <label for="razaoSocial">Razão social</label>

            <input
              type="text"
              id="razaoSocial"
              maxlength="180"
            >
          </div>

          <div class="campo">
            <label for="nomeFantasia">Nome fantasia</label>

            <input
              type="text"
              id="nomeFantasia"
              maxlength="180"
            >
          </div>

          <div class="campo">
            <label for="cnpj">CNPJ</label>

            <input
              type="text"
              id="cnpj"
              inputmode="text"
              maxlength="18"
              autocomplete="off"
            >
          </div>
        </section>

        <div class="campo">
          <label for="senha">Senha</label>

          <input
            type="password"
            id="senha"
            minlength="10"
            maxlength="72"
            autocomplete="new-password"
            required
          >

          <p class="ajuda">
            Use de 10 a 72 caracteres, com maiúscula, minúscula, número e símbolo.
          </p>
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirme a senha</label>

          <input
            type="password"
            id="confirmarSenha"
            minlength="10"
            maxlength="72"
            autocomplete="new-password"
            required
          >
        </div>
      </div>

      <div class="aceites">
        <label class="aceite">
          <input type="checkbox" id="aceitouTermos" required>

    <a href="cliente.html" class="voltar">

<script>
"use strict";

const API_PRODUCAO =
  "https://site-sala02-production.up.railway.app";

const ambienteLocal = [
  "localhost",
  "127.0.0.1"
].includes(window.location.hostname);

const API = ambienteLocal
  ? "http://127.0.0.1:3000"
  : API_PRODUCAO;

const formCadastro =
  document.getElementById("formCadastro");

const tipoPessoa =
  document.getElementById("tipoPessoa");

const dadosEmpresa =
  document.getElementById("dadosEmpresa");

const razaoSocial =
  document.getElementById("razaoSocial");

const nomeFantasia =
  document.getElementById("nomeFantasia");

const cnpj =
  document.getElementById("cnpj");

const cpf =
  document.getElementById("cpf");

const botaoCadastrar =
  document.getElementById("botaoCadastrar");

const mensagem =
  document.getElementById("mensagem");

function somenteNumeros(valor) {
  return String(valor || "").replace(/\D/g, "");
}

function exibirMensagem(texto, tipo = "") {
  mensagem.textContent = texto;
  mensagem.className = "mensagem";

  if (tipo) {
    mensagem.classList.add(tipo);
  }
}

function atualizarTipoPessoa() {
  const cadastroPJ =
    tipoPessoa.value === "PJ";

  dadosEmpresa.hidden = !cadastroPJ;
  razaoSocial.required = cadastroPJ;
  cnpj.required = cadastroPJ;

  if (!cadastroPJ) {
    razaoSocial.value = "";
    nomeFantasia.value = "";
    cnpj.value = "";
  }
}

function definirCarregamento(ativo) {
  botaoCadastrar.disabled = ativo;

  botaoCadastrar.textContent = ativo
    ? "Enviando cadastro..."
    : "Criar minha conta";
}

async function lerResposta(resposta) {
  const texto = await resposta.text();

  if (!texto) {
    return {};
  }

  try {
    return JSON.parse(texto);
  } catch (_) {
    return {
      erro: "O servidor retornou uma resposta inválida."
    };
  }
}


/* ==========================================================
   VALIDACAO-CADASTRO-SALA02-2026
   ========================================================== */

function normalizarCNPJCadastro(valor) {
  return String(valor || "")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, 14);
}

function formatarCPFEntrada(valor) {
  const numeros =
    somenteNumeros(valor)
      .slice(0, 11);

  if (!numeros) {
    return "";
  }

  let resultado =
    numeros.slice(0, 3);

  if (numeros.length > 3) {
    resultado +=
      "." +
      numeros.slice(3, 6);
  }

  if (numeros.length > 6) {
    resultado +=
      "." +
      numeros.slice(6, 9);
  }

  if (numeros.length > 9) {
    resultado +=
      "-" +
      numeros.slice(9, 11);
  }

  return resultado;
}

function formatarCNPJEntrada(valor) {
  const codigo =
    normalizarCNPJCadastro(valor);

  if (!codigo) {
    return "";
  }

  let resultado =
    codigo.slice(0, 2);

  if (codigo.length > 2) {
    resultado +=
      "." +
      codigo.slice(2, 5);
  }

  if (codigo.length > 5) {
    resultado +=
      "." +
      codigo.slice(5, 8);
  }

  if (codigo.length > 8) {
    resultado +=
      "/" +
      codigo.slice(8, 12);
  }

  if (codigo.length > 12) {
    resultado +=
      "-" +
      codigo.slice(12, 14);
  }

  return resultado;
}

function formatarTelefoneEntrada(valor) {
  const numeros =
    somenteNumeros(valor)
      .slice(0, 11);

  if (!numeros) {
    return "";
  }

  if (numeros.length <= 2) {
    return `(${numeros}`;
  }

  const ddd =
    numeros.slice(0, 2);

  const numero =
    numeros.slice(2);

  if (numero.length <= 4) {
    return `(${ddd}) ${numero}`;
  }

  if (numeros.length <= 10) {
    return (
      `(${ddd}) ` +
      numero.slice(0, 4) +
      "-" +
      numero.slice(4, 8)
    );
  }

  return (
    `(${ddd}) ` +
    numero.slice(0, 5) +
    "-" +
    numero.slice(5, 9)
  );
}

function validarCPFCadastro(valor) {
  const cpf =
    somenteNumeros(valor);

  if (cpf.length !== 11) {
    return false;
  }

  if (/^(\d)\1{10}$/.test(cpf)) {
    return false;
  }

  const cpfsTeste = new Set([
    "12345678909",
    "01234567890"
  ]);

  if (cpfsTeste.has(cpf)) {
    return false;
  }

  let soma = 0;

  for (let i = 0; i < 9; i++) {
    soma +=
      Number(cpf[i]) *
      (10 - i);
  }

  let digito1 =
    11 - (soma % 11);

  if (digito1 >= 10) {
    digito1 = 0;
  }

  if (
    digito1 !==
    Number(cpf[9])
  ) {
    return false;
  }

  soma = 0;

  for (let i = 0; i < 10; i++) {
    soma +=
      Number(cpf[i]) *
      (11 - i);
  }

  let digito2 =
    11 - (soma % 11);

  if (digito2 >= 10) {
    digito2 = 0;
  }

  return (
    digito2 ===
    Number(cpf[10])
  );
}

function validarCNPJCadastro(valor) {
  const cnpj =
    normalizarCNPJCadastro(valor);

  /*
   * Padrao 2026:
   * 12 primeiras posicoes:
   * A-Z ou 0-9
   *
   * 2 ultimas:
   * apenas digitos verificadores.
   */
  if (
    !/^[A-Z0-9]{12}\d{2}$/.test(
      cnpj
    )
  ) {
    return false;
  }

  if (
    /^([A-Z0-9])\1{11}\d{2}$/.test(
      cnpj
    )
  ) {
    return false;
  }

  function valorCaractere(
    caractere
  ) {
    return (
      caractere
        .charCodeAt(0) -
      48
    );
  }

  function calcularDigito(
    base,
    pesos
  ) {
    let soma = 0;

    for (
      let i = 0;
      i < pesos.length;
      i++
    ) {
      soma +=
        valorCaractere(
          base[i]
        ) *
        pesos[i];
    }

    const resto =
      soma % 11;

    return (
      resto === 0 ||
      resto === 1
    )
      ? 0
      : 11 - resto;
  }

  const base =
    cnpj.slice(0, 12);

  const primeiro =
    calcularDigito(
      base,
      [
        5, 4, 3, 2,
        9, 8, 7, 6,
        5, 4, 3, 2
      ]
    );

  if (
    primeiro !==
    Number(cnpj[12])
  ) {
    return false;
  }

  const segundo =
    calcularDigito(
      base + primeiro,
      [
        6, 5, 4, 3,
        2, 9, 8, 7,
        6, 5, 4, 3,
        2
      ]
    );

  return (
    segundo ===
    Number(cnpj[13])
  );
}

function validarTelefoneCadastro(
  valor
) {
  const telefone =
    somenteNumeros(valor);

  if (
    !/^\d{10,11}$/.test(
      telefone
    )
  ) {
    return false;
  }

  if (
    telefone.startsWith("00")
  ) {
    return false;
  }

  if (
    /^(\d)\1+$/.test(
      telefone
    )
  ) {
    return false;
  }

  const numero =
    telefone.slice(2);

  /*
   * Bloqueia placeholders como:
   * 9999-0000
   * 8888-1111
   */
  if (
    /^(\d)\1{3,}(\d)\2{3,}$/.test(
      numero
    )
  ) {
    return false;
  }

  const sequencias =
    new Set([
      "12345678",
      "123456789",
      "01234567",
      "012345678",
      "87654321",
      "987654321"
    ]);

  if (
    sequencias.has(
      numero
    )
  ) {
    return false;
  }

  if (
    /^[01]/.test(
      numero
    )
  ) {
    return false;
  }

  return true;
}

function senhaTemPadraoFraco(
  valor
) {
  const senha =
    String(valor || "")
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase();

  if (
    /(.)\1{3,}/u.test(
      senha
    )
  ) {
    return true;
  }

  const padroes = [
    "123456",
    "654321",
    "qwerty",
    "asdfgh",
    "abcdef",
    "senha123",
    "password",
    "admin123"
  ];

  return padroes.some(
    (padrao) =>
      senha.includes(
        padrao
      )
  );
}

function senhaAtendePolitica(
  valor
) {
  const senha =
    String(valor || "");

  if (
    senha.length < 10 ||
    senha.length > 72
  ) {
    return false;
  }

  if (
    !/\p{Ll}/u.test(
      senha
    )
  ) {
    return false;
  }

  if (
    !/\p{Lu}/u.test(
      senha
    )
  ) {
    return false;
  }

  if (
    !/\d/.test(
      senha
    )
  ) {
    return false;
  }

  if (
    !/[^\p{L}\d\s]/u.test(
      senha
    )
  ) {
    return false;
  }

  if (
    senhaTemPadraoFraco(
      senha
    )
  ) {
    return false;
  }

  return true;
}

function avaliarForcaSenha(
  valor
) {
  const senha =
    String(valor || "");

  if (!senha) {
    return {
      nivel: 0,
      rotulo: "Digite uma senha",
      valida: false
    };
  }

  let pontos = 0;

  if (senha.length >= 10) {
    pontos++;
  }

  if (senha.length >= 14) {
    pontos++;
  }

  if (
    /\p{Ll}/u.test(senha) &&
    /\p{Lu}/u.test(senha)
  ) {
    pontos++;
  }

  if (/\d/.test(senha)) {
    pontos++;
  }

  if (
    /[^\p{L}\d\s]/u.test(
      senha
    )
  ) {
    pontos++;
  }

  if (
    senhaTemPadraoFraco(
      senha
    )
  ) {
    pontos =
      Math.max(
        1,
        pontos - 2
      );
  }

  let nivel = 1;
  let rotulo =
    "Muito fraca";

  if (pontos === 2) {
    nivel = 2;
    rotulo = "Fraca";
  }

  if (pontos === 3) {
    nivel = 3;
    rotulo = "Boa";
  }

  if (pontos >= 4) {
    nivel = 4;
    rotulo = "Forte";
  }

  return {
    nivel,
    rotulo,
    valida:
      senhaAtendePolitica(
        senha
      )
  };
}

async function enviarCadastro(evento) {
  evento.preventDefault();
  exibirMensagem("");

  if (!validarFormulario()) {
    return;
  }

  const cadastroPJ =
    tipoPessoa.value === "PJ";

  const corpo = {
    tipo_pessoa: tipoPessoa.value,

      document.getElementById("nome")

    cpf: somenteNumeros(cpf.value),

    aceitou_termos:
      document.getElementById("aceitouTermos")
        .checked,

    aceitou_privacidade:
      document.getElementById("aceitouPrivacidade")
        .checked
  };

  if (cadastroPJ) {
    corpo.razao_social =
      razaoSocial.value.trim();

    corpo.nome_fantasia =
      nomeFantasia.value.trim();

    corpo.cnpj =
      somenteNumeros(cnpj.value);
  }

  definirCarregamento(true);

  try {
    const resposta = await fetch(
      API + "/api/public/cadastro",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(corpo)
      }
    );

    const dados =
      await lerResposta(resposta);

    if (!resposta.ok) {
      exibirMensagem(
        dados.erro ||
          "Não foi possível realizar o cadastro.",
        "erro"
      );

      return;
    }

    exibirMensagem(
      dados.mensagem ||
        "Solicitacao recebida. Aguarde a validacao da Sala 02.",
      "sucesso"
    );

    formCadastro.reset();
    atualizarTipoPessoa();

  } catch (erro) {
    console.error(
      "Falha ao conectar com a API:",
      erro
    );

    exibirMensagem(
      "Não foi possível conectar com o servidor.",
      "erro"
    );

  } finally {
    definirCarregamento(false);
  }
}

function formatarTelefoneCadastro(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "")
      .slice(0, 11);

  if (!numeros) {
    return "";
  }

  if (numeros.length <= 2) {
    return "(" + numeros;
  }

  const ddd =
    numeros.slice(0, 2);

  const restante =
    numeros.slice(2);

  if (restante.length <= 4) {
    return (
      "(" +
      ddd +
      ") " +
      restante
    );
  }

  if (numeros.length <= 10) {
    return (
      "(" +
      ddd +
      ") " +
      restante.slice(0, 4) +
      "-" +
      restante.slice(4, 8)
    );
  }

  return (
    "(" +
    ddd +
    ") " +
    restante.slice(0, 5) +
    "-" +
    restante.slice(5, 9)
  );
}

function mascaraCPF(valor) {
  const numeros =
    String(valor || "")
      .replace(/\D/g, "")
      .slice(0, 11);

  return numeros
    .replace(
      /^(\d{3})(\d)/,
      "$1.$2"
    )
    .replace(
      /^(\d{3})\.(\d{3})(\d)/,
      "$1.$2.$3"
    )
    .replace(
      /^(\d{3})\.(\d{3})\.(\d{3})(\d)/,
      "$1.$2.$3-$4"
    );
}

function normalizarCNPJVisual(valor) {
  return String(valor || "")
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ""
    )
    .slice(0, 14);
}

function mascaraCNPJ(valor) {
  const codigo =
    normalizarCNPJVisual(
      valor
    );

  return codigo
    .replace(
      /^([A-Z0-9]{2})([A-Z0-9])/,
      "$1.$2"
    )
    .replace(
      /^([A-Z0-9]{2})\.([A-Z0-9]{3})([A-Z0-9])/,
      "$1.$2.$3"
    )
    .replace(
      /^([A-Z0-9]{2})\.([A-Z0-9]{3})\.([A-Z0-9]{3})([A-Z0-9])/,
      "$1.$2.$3/$4"
    )
    .replace(
      /^([A-Z0-9]{2})\.([A-Z0-9]{3})\.([A-Z0-9]{3})\/([A-Z0-9]{4})([0-9])/,
      "$1.$2.$3/$4-$5"
    );
}

            return;
          }

          campo.dataset.olhoSala02 =
            "ativo";

          const wrapper =
            document.createElement(
              "div"
            );

          wrapper.className =
            "campo-senha-sala02";

          campo.parentNode.insertBefore(
            wrapper,
            campo
          );

          wrapper.appendChild(
            campo
          );

          const botao =
            document.createElement(
              "button"
            );

          botao.type =
            "button";

          botao.className =
            "botao-olho-sala02";

          botao.setAttribute(
            "aria-label",
            "Mostrar senha"
          );

          botao.setAttribute(
            "title",
            "Mostrar senha"
          );

          botao.innerHTML =
            iconeAberto;

          botao.addEventListener(
            "click",
            () => {

              const mostrando =
                campo.type === "text";

              campo.type =
                mostrando
                  ? "password"
                  : "text";

              botao.innerHTML =
                mostrando
                  ? iconeAberto
                  : iconeFechado;

              const texto =
                mostrando
                  ? "Mostrar senha"
                  : "Ocultar senha";

              botao.setAttribute(
                "aria-label",
                texto
              );

              botao.setAttribute(
                "title",
                texto
              );

              campo.focus();
            }
          );

          wrapper.appendChild(
            botao
          );
        }
      );
  }
);
</script>
</body>
</html>
