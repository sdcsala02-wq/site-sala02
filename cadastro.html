<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Criar acesso | Sala 02</title>

  <style>
    :root {
      --azul: #071f3d;
      --azul-escuro: #020914;
      --dourado: #d7a85e;
      --fundo: #f4efe7;
      --texto: #334155;
      --borda: #cbd5e1;
      --erro: #b42318;
      --sucesso: #067647;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--azul),
        var(--azul-escuro)
      );
      color: var(--azul);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 38px;
      border-radius: 28px;
      background: var(--fundo);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
    }

    .marca {
      margin: 0 0 8px;
      color: var(--dourado);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .introducao {
      margin: 0 0 28px;
      color: var(--texto);
      line-height: 1.55;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      border: 1px solid var(--borda);
      border-radius: 13px;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--dourado);
      box-shadow: 0 0 0 3px rgba(215, 168, 94, 0.22);
    }

    .secao-empresa {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 20px;
      border: 1px solid #d9c9ad;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.45);
    }

    .secao-empresa h2 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 18px;
    }

    [hidden] {
      display: none !important;
    }

    .ajuda {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
    }

    .aceites {
      display: grid;
      gap: 12px;
      margin: 22px 0;
    }

    .aceite {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 10px;
      align-items: start;
      color: var(--texto);
      font-size: 14px;
      line-height: 1.45;
    }

    .aceite input {
      width: 18px;
      min-height: 18px;
      margin-top: 2px;
    }

    .aceite a {
      color: var(--azul);
      font-weight: 800;
    }

    button {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--azul);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .mensagem {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
    }

    .mensagem.erro {
      color: var(--erro);
    }

    .mensagem.sucesso {
      color: var(--sucesso);
    }

    .voltar {
      display: block;
      margin-top: 20px;
      color: var(--azul);
      text-align: center;
      font-weight: 900;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .card {
        padding: 26px 20px;
      }

      .grade,
      .secao-empresa {
        grid-template-columns: 1fr;
      }

      .campo-completo,
      .secao-empresa,
      .secao-empresa h2 {
        grid-column: 1;
      }
    }
  </style>

<body>
  <main class="card">
    <p class="marca">SDC SALA 02</p>

    <h1>Crie seu acesso</h1>

    <p class="introducao">
      Cadastre o responsável para acompanhar processos,
      documentos e movimentações pelo Portal do Cliente.
    </p>

    <form id="formCadastro" novalidate>
      <div class="grade">
        <div class="campo campo-completo">
          <label for="tipoPessoa">Tipo de cadastro</label>

          <select id="tipoPessoa" required>
            <option value="PF">Pessoa Física</option>
            <option value="PJ">Pessoa Jurídica</option>
          </select>
        </div>

        <div class="campo campo-completo">
          <label for="nome">Nome completo do responsável</label>

          <input
            type="text"
            id="nome"
            minlength="3"
            maxlength="150"
            autocomplete="name"
            required
          >
        </div>

        <div class="campo">
          <label for="cpf">CPF do responsável</label>

          <input
            type="text"
            id="cpf"
            inputmode="numeric"
            maxlength="14"
            autocomplete="off"
            required
          >
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>

          <input
            type="tel"
            id="telefone"
            inputmode="tel"
            maxlength="20"
            autocomplete="tel"
          >
        </div>

        <div class="campo campo-completo">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            maxlength="180"
            autocomplete="email"
            required
          >
        </div>

        <section
          id="dadosEmpresa"
          class="secao-empresa"
          hidden
        >
          <h2>Dados da empresa</h2>

          <div class="campo campo-completo">
            <label for="razaoSocial">Razão social</label>

            <input
              type="text"
              id="razaoSocial"
              maxlength="180"
            >
          </div>

          <div class="campo">
            <label for="nomeFantasia">Nome fantasia</label>

            <input
              type="text"
              id="nomeFantasia"
              maxlength="180"
            >
          </div>

          <div class="campo">
            <label for="cnpj">CNPJ</label>

            <input
              type="text"
              id="cnpj"
              inputmode="numeric"
              maxlength="18"
              autocomplete="off"
            >
          </div>
        </section>

        <div class="campo">
          <label for="senha">Senha</label>

          <input
            type="password"
            id="senha"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          >

          <p class="ajuda">
            Utilize de 8 a 72 caracteres, com pelo menos
            uma letra e um número.
          </p>
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirme a senha</label>

          <input
            type="password"
            id="confirmarSenha"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          >
        </div>
      </div>

      <div class="aceites">
        <label class="aceite">
          <input type="checkbox" id="aceitouTermos" required>

          <span>
            Li e aceito os
            <a href="termos-de-uso.html" target="_blank">
              Termos de Uso
            </a>
            — versão 1.0.
          </span>
        </label>

        <label class="aceite">
          <input type="checkbox" id="aceitouPrivacidade" required>

          <span>
            Li e aceito a
            <a href="politica-de-privacidade.html" target="_blank">
              Política de Privacidade
            </a>
            — versão 1.0.
          </span>
        </label>
      </div>

      <button type="submit" id="botaoCadastrar">
        Criar minha conta
      </button>

      <div
        id="mensagem"
        class="mensagem"
        role="alert"
        aria-live="polite"
      ></div>
    </form>

    <a href="cliente.html" class="voltar">
      Já tenho acesso
    </a>
  </main>
<script>
"use strict";

const API_PRODUCAO =
  "https://site-sala02-production.up.railway.app";

const ambienteLocal = [
  "localhost",
  "127.0.0.1"
].includes(window.location.hostname);

const API = ambienteLocal
  ? "http://127.0.0.1:3102"
  : API_PRODUCAO;

const formCadastro =
  document.getElementById("formCadastro");

const tipoPessoa =
  document.getElementById("tipoPessoa");

const dadosEmpresa =
  document.getElementById("dadosEmpresa");

const razaoSocial =
  document.getElementById("razaoSocial");

const nomeFantasia =
  document.getElementById("nomeFantasia");

const cnpj =
  document.getElementById("cnpj");

const cpf =
  document.getElementById("cpf");

const botaoCadastrar =
  document.getElementById("botaoCadastrar");

const mensagem =
  document.getElementById("mensagem");

function somenteNumeros(valor) {
  return String(valor || "").replace(/\D/g, "");
}

function exibirMensagem(texto, tipo = "") {
  mensagem.textContent = texto;
  mensagem.className = "mensagem";

  if (tipo) {
    mensagem.classList.add(tipo);
  }
}

function atualizarTipoPessoa() {
  const cadastroPJ =
    tipoPessoa.value === "PJ";

  dadosEmpresa.hidden = !cadastroPJ;
  razaoSocial.required = cadastroPJ;
  cnpj.required = cadastroPJ;

  if (!cadastroPJ) {
    razaoSocial.value = "";
    nomeFantasia.value = "";
    cnpj.value = "";
  }
}

function definirCarregamento(ativo) {
  botaoCadastrar.disabled = ativo;

  botaoCadastrar.textContent = ativo
    ? "Enviando cadastro..."
    : "Criar minha conta";
}

async function lerResposta(resposta) {
  const texto = await resposta.text();

  if (!texto) {
    return {};
  }

  try {
    return JSON.parse(texto);
  } catch (_) {
    return {
      erro: "O servidor retornou uma resposta inválida."
    };
  }
}

function validarFormulario() {
  if (!formCadastro.reportValidity()) {
    return false;
  }

  const senha =
    document.getElementById("senha").value;

  const confirmarSenha =
    document.getElementById("confirmarSenha").value;

  if (senha !== confirmarSenha) {
    exibirMensagem(
      "As senhas informadas não conferem.",
      "erro"
    );

    return false;
  }

  if (
    senha.length < 8 ||
    senha.length > 72 ||
    !/\p{L}/u.test(senha) ||
    !/\d/.test(senha)
  ) {
    exibirMensagem(
      "A senha deve ter entre 8 e 72 caracteres, com pelo menos uma letra e um número.",
      "erro"
    );

    return false;
  }

  return true;
}

async function enviarCadastro(evento) {
  evento.preventDefault();
  exibirMensagem("");

  if (!validarFormulario()) {
    return;
  }

  const cadastroPJ =
    tipoPessoa.value === "PJ";

  const corpo = {
    tipo_pessoa: tipoPessoa.value,

    nome:
      document.getElementById("nome")
        .value
        .trim(),

    cpf: somenteNumeros(cpf.value),

    email:
      document.getElementById("email")
        .value
        .trim()
        .toLowerCase(),

    telefone: somenteNumeros(
      document.getElementById("telefone").value
    ),

    senha:
      document.getElementById("senha").value,

    aceitou_termos:
      document.getElementById("aceitouTermos")
        .checked,

    aceitou_privacidade:
      document.getElementById("aceitouPrivacidade")
        .checked
  };

  if (cadastroPJ) {
    corpo.razao_social =
      razaoSocial.value.trim();

    corpo.nome_fantasia =
      nomeFantasia.value.trim();

    corpo.cnpj =
      somenteNumeros(cnpj.value);
  }

  definirCarregamento(true);

  try {
    const resposta = await fetch(
      API + "/api/public/cadastro",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(corpo)
      }
    );

    const dados =
      await lerResposta(resposta);

    if (!resposta.ok) {
      exibirMensagem(
        dados.erro ||
          "Não foi possível realizar o cadastro.",
        "erro"
      );

      return;
    }

    exibirMensagem(
      dados.mensagem ||
        "Cadastro realizado com sucesso.",
      "sucesso"
    );

    formCadastro.reset();
    atualizarTipoPessoa();

    window.setTimeout(() => {
      window.location.href = "cliente.html";
    }, 1600);

  } catch (erro) {
    console.error(
      "Falha ao conectar com a API:",
      erro
    );

    exibirMensagem(
      "Não foi possível conectar com o servidor.",
      "erro"
    );

  } finally {
    definirCarregamento(false);
  }
}

tipoPessoa.addEventListener(
  "change",
  atualizarTipoPessoa
);

cpf.addEventListener("input", () => {
  cpf.value =
    somenteNumeros(cpf.value).slice(0, 11);
});

cnpj.addEventListener("input", () => {
  cnpj.value =
    somenteNumeros(cnpj.value).slice(0, 14);
});

formCadastro.addEventListener(
  "submit",
  enviarCadastro
);

atualizarTipoPessoa();
</script>
  <script src="js/analytics-consent.js" defer></script>
</body>
</html>
