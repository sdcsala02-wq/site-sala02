  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #071f3d, #020914);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #071f3d;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #f4efe7;
      padding: 42px;
      border-radius: 32px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
      color: #071f3d;
    }

    p {
      color: #475569;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 16px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d7a85e;
      box-shadow: 0 0 0 3px rgba(215, 168, 94, 0.25);
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 999px;
      background: #071f3d;
      color: white;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(7, 31, 61, 0.35);
    }

    a {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #071f3d;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>SALA 02</h1>

    <p>
      Crie seu primeiro acesso para acompanhar seu processo em tempo real.
    </p>

    <input type="text" id="nome" placeholder="Nome completo" required>

    <input type="text" id="cpf" placeholder="CPF" required>

    <input type="email" id="email" placeholder="E-mail cadastrado" required>

    <input type="password" id="senha" placeholder="Criar senha" required>

    <button onclick="cadastrar()">
      Criar minha conta
    </button>

    <a href="cliente.html">
      Já tenho acesso
    </a>

  </div>

  <script>

    async function cadastrar() {

      const nome = document.getElementById("nome").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!nome || !cpf || !email || !senha) {

        alert("Preencha todos os campos.");
        return;

      }

      try {

        const resposta = await fetch("https://site-sala02-production.up.railway.app/clientes", {

          method: "POST",
          
          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            nome,
            cpf,
            email,
            senha
          })

        });

        const dados = await resposta.json();

        if (!resposta.ok) {

          alert(dados.erro || "Erro ao criar conta.");
          return;

        }

        alert("Conta criada com sucesso!");

        window.location.href = "cliente.html";

      } catch (erro) {

        alert("Erro ao conectar com o servidor.");

      }

    }

  </script>

</body>

</html>
